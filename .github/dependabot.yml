version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # The test project holds the one package reference; the library depends on nothing.
  - package-ecosystem: "nuget"
    directory: "/tests/VeliraPay.Tests"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      nuget:
        patterns:
          - "*"
