name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  tests:
    name: .NET 10 and 11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build VeliraPay.slnx --configuration Release -warnaserror

      - name: Run tests
        run: dotnet test --solution VeliraPay.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/VeliraPay/VeliraPay.csproj --configuration Release --no-build --output artifacts
