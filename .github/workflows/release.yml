name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    environment: nuget

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Check the tag
        run: |
          version=$(dotnet msbuild src/VeliraPay/VeliraPay.csproj -getProperty:Version)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match the version in VeliraPay.csproj, ${version}." >&2
            exit 1
          fi

      - name: Build
        run: dotnet build VeliraPay.slnx --configuration Release -warnaserror

      - name: Run tests
        run: dotnet test --solution VeliraPay.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/VeliraPay/VeliraPay.csproj --configuration Release --no-build --output artifacts

      # Turns this job's OIDC token into a nuget.org API key that lasts an hour, so it comes right before the push.
      - name: Log in to NuGet
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the .snupkg beside the .nupkg too.
      - name: Publish
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
